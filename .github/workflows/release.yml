name: Release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x86_64 and Java 21
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_TERM_COLOR: always
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Validate release version
        id: version
        shell: python
        run: |
          import os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path('cli/Cargo.toml').read_text())['package']['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', version):
              raise SystemExit('Invalid release version')
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('Tag must match v followed by the product version')
          if f'version = "{version}"' not in pathlib.Path('extension/build.gradle.kts').read_text():
              raise SystemExit('CLI and extension versions must match')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\n')
              output.write(f'prerelease={str("-" in version.split("+", 1)[0]).lower()}\n')

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Install Rust toolchain
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc

      - name: Check and build CLI
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --manifest-path cli/Cargo.toml -- --check
          cargo check --manifest-path cli/Cargo.toml --target x86_64-pc-windows-msvc --locked
          cargo clippy --manifest-path cli/Cargo.toml --target x86_64-pc-windows-msvc --locked --all-targets -- -D warnings
          cargo test --manifest-path cli/Cargo.toml --target x86_64-pc-windows-msvc --release --locked
          cargo build --manifest-path cli/Cargo.toml --target x86_64-pc-windows-msvc --release --locked

      - name: Build extension
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          .\extension\gradlew.bat -p extension build --no-daemon

      - name: Check Java and native IPC fixtures
        run: .\verification\windows-checks.ps1 -Classes (Join-Path $env:RUNNER_TEMP 'burpctl-checks')

      - name: Verify release artifacts
        run: python verification/release-checks.py

      - name: Stage release artifacts
        shell: python
        run: |
          import os, pathlib, shutil
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release'
          output.mkdir()
          shutil.copy2('cli/target/x86_64-pc-windows-msvc/release/burpctl.exe', output / 'burpctl.exe')
          shutil.copy2('extension/build/libs/burpctl-extension.jar', output / 'burpctl-extension.jar')

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: burpctl-windows-x86_64
          path: |
            ${{ runner.temp }}/release/burpctl.exe
            ${{ runner.temp }}/release/burpctl-extension.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft-release:
    name: Create draft release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: burpctl-windows-x86_64
          path: release
          digest-mismatch: error

      - name: Create draft with verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes=$(gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" --jq .body)
          printf '%s\n' "$notes" | sed -n '/^\*\*Full Changelog\*\*: /p' > "$RUNNER_TEMP/release-notes.md"
          if [[ ! -s "$RUNNER_TEMP/release-notes.md" ]]; then
            printf '**Full Changelog**: https://github.com/%s/commits/%s\n' \
              "$GH_REPO" "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          fi
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/burpctl.exe release/burpctl-extension.jar \
            --repo "$GH_REPO" --verify-tag --draft --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
