[package]
name = "burpctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
serde = "1.0"
sha2 = "0.10.9"
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
uds_windows = "=1.2.1"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Authorization", "Win32_System_Threading", "Win32_Networking_WinSock"] }

[profile.release]
opt-level = "z"
strip = true
lto = "thin"
codegen-units = 1
